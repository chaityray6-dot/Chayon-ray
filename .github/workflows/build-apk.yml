name: Build Android APK & Play Store Bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 platforms;android-36 build-tools;36.0.0 platform-tools'
          accept-android-sdk-licenses: true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK (for direct mobile testing)
        run: gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Copy Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Smart-PDF-Reader-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PDF-Reader-Debug-APK
          path: Smart-PDF-Reader-debug.apk
          retention-days: 30

      - name: Build Signed Play Store AAB & Release APK (if keystore secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            gradle bundleRelease assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
            cp app/build/outputs/bundle/release/app-release.aab Smart-PDF-Reader-playstore.aab
            cp app/build/outputs/apk/release/app-release.apk Smart-PDF-Reader-release.apk
            echo "HAS_RELEASE=true" >> $GITHUB_ENV
          else
            echo "Skipping release AAB/APK (Play Store signing secrets not configured yet)."
            echo "HAS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Upload Play Store Release AAB & APK artifacts
        if: env.HAS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PDF-Reader-PlayStore-Release
          path: |
            Smart-PDF-Reader-playstore.aab
            Smart-PDF-Reader-release.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="Smart-PDF-Reader-debug.apk"
          if [ -f Smart-PDF-Reader-playstore.aab ]; then
            FILES="$FILES Smart-PDF-Reader-playstore.aab Smart-PDF-Reader-release.apk"
          fi
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk $FILES --clobber
          else
            gh release create latest-apk $FILES \
              --title "Smart PDF Reader Latest Build" \
              --notes "Automatically built Android APK (and Play Store AAB when signing secrets are set) for Smart PDF Reader."
          fi
