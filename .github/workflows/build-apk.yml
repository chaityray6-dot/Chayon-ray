name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK with friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk DocuVerse-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuVerse-APK
          path: DocuVerse-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases (direct .apk download)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk DocuVerse-debug.apk --clobber
          else
            gh release create latest-apk DocuVerse-debug.apk \
              --title "DocuVerse Latest APK" \
              --notes "Latest automatically built Android APK for DocuVerse."
          fi
